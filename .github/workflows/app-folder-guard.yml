name: App Folder Guard

# Keeps the application folder of a platform from being served over HTTP. Found 2026-10-20: on Dopemine, Engage,
# Memory and Sheet the folder next to the docroot (`~/<host>/<key>/`) answered 200 for database/database.sqlite
# (the live SQLite database), storage/logs/laravel.log, composer files and vendor/autoload.php. The newer
# platforms have a `.htaccess` with `Require all denied` in that folder; these four never got one.
#
#   check          public probe of every platform's sensitive paths (status codes only; nothing is read). Probes twice,
#                  5 s apart, and prints each attempt, so a short window shows up instead of being missed
#   apply          write `.htaccess` (Require all denied) into the named app folders over SSH, then re-probe; if the site
#                  itself stops answering 200 the file is removed again and the run fails
#   docroot-check  read-only second layer review: over SSH, what `docroot` WOULD do to each docroot `.htaccess` (nothing is
#                  written), plus the public probe. Empty `apps` = all platforms
#   docroot        second layer: put a narrow rule block at the TOP of the DOCROOT's own `.htaccess`
#                  (`~/<host>.infodot.co.za/.htaccess`, which deploys never touch) that refuses the sensitive names directly
#                  under `/<key>/` (.env, .git*, artisan, composer/package files, phpunit.xml, database/, storage/, vendor/,
#                  bootstrap/, config/, tests/, node_modules/). Observed 2026-10-22: for a few seconds after the first deploy
#                  that touched the app-folder guard, Dopemine and Ehail answered 200 for those paths, then 403 a minute later
#                  (suspected: the per-directory `.htaccess` inside the freshly changed tree not applied yet). The docroot file
#                  is outside the deployed tree. Records / /up /login before, compares after; if any changed, restores the
#                  previous docroot `.htaccess` and fails. Needs explicit pairs.
#
#   docroot-inventory  READ-ONLY inventory from the real host of what moving each docroot to `~/<host>.infodot.co.za/<key>/public`
#                  depends on: layout, docroot index.php shim (verdict only), `.htaccess` directive NAMES of the docroot and of
#                  `<key>/public`, symlinks, uploads, cron line COUNTS, sizes. Prints names, sizes and modes, never file contents;
#                  writes nothing on the host (no file, no mode, no link, no crontab write). Empty `apps` = all platforms.
#                  Output: job summary table + the raw output as artifact `docroot-inventory`. Host side:
#                  tools/docroot-inventory-host.sh, tested by tools/test-docroot-inventory.sh.
#
# Fixed commands only (the host-side logic is tools/docroot-guard-host.sh, tested by tools/test-docroot-guard.sh).
# `apps` is a list of "host:key" pairs, host label then app folder, e.g. "dopemine:dopemine engage:engage". The host label
# is not always the key (press is pres, sheet is sheets, docs is doc) and the app folder is not always named after it
# (Files' is `dotfiles`: files:dotfiles).
# Secrets for apply, docroot, docroot-check, docroot-inventory: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check | apply | docroot-check | docroot | docroot-inventory
        required: true
        default: check
        type: choice
        options: [check, apply, docroot-check, docroot, docroot-inventory]
      apps:
        description: 'Pairs host:key, space separated (apply and docroot need at least one; check, docroot-check and docroot-inventory default to all platforms)'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  guard:
    name: ${{ inputs.mode }} app folders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode }}
      APPS: ${{ inputs.apps }}
      ALL_PLATFORMS: >-
        tasks:tasks forms:forms files:dotfiles agents:agents analytics:analytics auction:auction billing:billing central:central
        design:design dopemine:dopemine ehail:ehail emall:emall engage:engage farms:farms finance:finance hr:hr memory:memory
        notify:notify plug:plug pres:press projects:projects pulse:pulse sheets:sheet tutor:tutor doc:doc
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        run: |
          printf '%s\n' "$APPS" | grep -Eq '^[a-z0-9: -]*$' || { echo "::error::apps may only contain a-z, 0-9, colon, space and dash"; exit 1; }
          if [ "$MODE" = apply ] || [ "$MODE" = docroot ]; then
            [ -n "$APPS" ] || { echo "::error::$MODE needs apps"; exit 1; }
          fi
          for a in $APPS; do printf '%s' "$a" | grep -Eq '^[a-z0-9-]+:[a-z0-9-]+$' || { echo "::error::bad pair [$a]"; exit 1; }; done

      - name: Set up SSH
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'docroot' || inputs.mode == 'docroot-check' || inputs.mode == 'docroot-inventory' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Write the guard (apply)
        if: ${{ inputs.mode == 'apply' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "bash -s -- $APPS" <<'GUARD'
          set -euo pipefail
          for pair in "$@"; do
            host="${pair%%:*}"; key="${pair##*:}"; app="$HOME/$host.infodot.co.za/$key"
            [ -f "$app/artisan" ] || { echo "$pair: no Laravel app at $app, skipped" >&2; continue; }
            if [ -f "$app/.htaccess" ] && grep -q 'Require all denied' "$app/.htaccess"; then
              echo "$pair: guard already present"
            elif [ -f "$app/.htaccess" ]; then
              cp "$app/.htaccess" "$app/.htaccess.before-guard"
              printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$app/.htaccess"
              echo "$pair: guard appended (original kept as .htaccess.before-guard)"
            else
              printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$app/.htaccess"
              echo "$pair: guard written (new file)"
            fi
          done
          GUARD

      - name: Probe from outside
        if: ${{ inputs.mode == 'check' || inputs.mode == 'apply' }}
        env:
          PROBE_RETRIES: ${{ inputs.mode == 'check' && '2' || '1' }}
          PROBE_WAIT: "5"
        run: |
          sleep 8   # the web server re-reads .htaccess lazily
          read -ra LIST <<< "${APPS:-$ALL_PLATFORMS}"
          bash tools/probe-exposure.sh "${LIST[@]}" | tee probe.txt
        continue-on-error: true
        id: probe

      - name: Undo if the sites stopped answering (apply)
        if: ${{ inputs.mode == 'apply' && steps.probe.outcome != 'skipped' }}
        run: |
          broken=""
          for a in $APPS; do
            h="${a%%:*}"
            c=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$h.infodot.co.za/up")
            [ "$c" = 200 ] || broken="$broken $a($c)"
          done
          if [ -n "$broken" ]; then
            echo "::error::these sites no longer answer /up with 200:$broken -- removing the guard I wrote"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "bash -s -- $APPS" <<'UNDO'
          for pair in "$@"; do
            host="${pair%%:*}"; key="${pair##*:}"; app="$HOME/$host.infodot.co.za/$key"
            if [ -f "$app/.htaccess.before-guard" ]; then mv -f "$app/.htaccess.before-guard" "$app/.htaccess"; else rm -f "$app/.htaccess"; fi
          done
          UNDO
            exit 1
          fi

      - name: Fail if anything is still exposed
        if: ${{ inputs.mode == 'check' || inputs.mode == 'apply' }}
        run: |
          grep -q EXPOSED probe.txt && { echo "::error::an app folder is still readable over HTTP (see the probe step)"; exit 1; } || echo "nothing exposed"

      # ---- second layer: the docroot's own .htaccess (modes docroot-check and docroot) ----

      - name: Review what docroot would do (docroot-check, read-only)
        if: ${{ inputs.mode == 'docroot-check' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -o pipefail
          LIST="${APPS:-$ALL_PLATFORMS}"   # validated words only; expanded on the host side of the command line
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- plan $LIST" < tools/docroot-guard-host.sh | tee docroot-actions.txt

      - name: Probe from outside (docroot-check)
        if: ${{ inputs.mode == 'docroot-check' }}
        env:
          PROBE_RETRIES: "2"
          PROBE_WAIT: "5"
        run: |
          read -ra LIST <<< "${APPS:-$ALL_PLATFORMS}"
          bash tools/probe-exposure.sh "${LIST[@]}" | tee probe.txt
        continue-on-error: true

      - name: Say so if the review sees an exposed path (docroot-check)
        if: ${{ inputs.mode == 'docroot-check' }}
        run: |
          if grep -q EXPOSED probe.txt; then echo "::warning::a sensitive path answered 200 at some attempt (see the probe step); docroot would add the second layer"; else echo "no sensitive path answered 200"; fi

      - name: Record what the sites answer before (docroot)
        if: ${{ inputs.mode == 'docroot' }}
        run: |
          read -ra PAIRS <<< "$APPS"
          mapfile -t HOSTS < <(printf '%s\n' "${PAIRS[@]}" | cut -d: -f1 | sort -u)
          bash tools/site-status.sh "${HOSTS[@]}" | tee before.txt

      - name: Write the docroot block (docroot)
        if: ${{ inputs.mode == 'docroot' }}
        id: write
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- write $APPS" < tools/docroot-guard-host.sh | tee docroot-actions.txt
        continue-on-error: true

      - name: Verify, and undo if a site changed (docroot)
        if: ${{ inputs.mode == 'docroot' && steps.write.outcome != 'skipped' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROBE_RETRIES: "3"
          PROBE_WAIT: "5"
        run: |
          read -ra PAIRS <<< "$APPS"
          mapfile -t HOSTS < <(printf '%s\n' "${PAIRS[@]}" | cut -d: -f1 | sort -u)
          sleep 8   # the web server re-reads .htaccess lazily
          for _ in 1 2 3; do
            bash tools/site-status.sh "${HOSTS[@]}" > after.txt
            cmp -s before.txt after.txt && break
            sleep 5
          done
          echo "== after:"; cat after.txt
          bash tools/probe-exposure.sh "${PAIRS[@]}" | tee probe.txt || true
          bad=""
          for a in "${PAIRS[@]}"; do
            h="${a%%:*}"
            [ "$(grep "^$h: " before.txt)" = "$(grep "^$h: " after.txt)" ] || bad="$bad $a"
          done
          if [ -n "$bad" ]; then
            echo "::error::/, /up or /login changed for:$bad -- restoring the previous docroot .htaccess"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- undo $bad" < tools/docroot-guard-host.sh | tee docroot-undo.txt
            exit 1
          fi
          echo "the sites answer exactly what they answered before"

      - name: Fail if the write failed or a sensitive path is still readable (docroot)
        if: ${{ inputs.mode == 'docroot' && steps.write.outcome != 'skipped' }}
        env:
          WRITE_OUTCOME: ${{ steps.write.outcome }}
        run: |
          [ "$WRITE_OUTCOME" = success ] || { echo "::error::the host script reported a problem (see the write step); nothing is guessed, check the lines above"; exit 1; }
          if grep -q '^EXPOSED persistent' probe.txt; then
            echo "::error::a sensitive path under an app folder still answers 200 after the rule was written (the rule may not apply on this host); see the probe lines"; exit 1
          fi
          if grep -q '^EXPOSED transient' probe.txt; then
            echo "::warning::a sensitive path answered 200 on an early attempt and was blocked later (see the timeline in the probe step)"
          fi
          echo "docroot rule written and verified"

      - name: Job summary (docroot modes)
        if: ${{ always() && (inputs.mode == 'docroot' || inputs.mode == 'docroot-check') }}
        run: bash tools/docroot-guard-summary.sh "$MODE" docroot-actions.txt before.txt after.txt probe.txt docroot-undo.txt >> "$GITHUB_STEP_SUMMARY"

      # ---- read-only inventory for moving the docroot to <key>/public (mode docroot-inventory) ----

      - name: Inventory of the document roots (docroot-inventory, read-only)
        if: ${{ inputs.mode == 'docroot-inventory' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -o pipefail
          LIST="${APPS:-$ALL_PLATFORMS}"   # validated words only; expanded on the host side of the command line
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $LIST" < tools/docroot-inventory-host.sh | tee docroot-inventory.txt

      - name: Job summary (docroot-inventory)
        if: ${{ always() && inputs.mode == 'docroot-inventory' }}
        run: bash tools/docroot-inventory-summary.sh docroot-inventory.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw inventory (docroot-inventory)
        if: ${{ always() && inputs.mode == 'docroot-inventory' }}
        uses: actions/upload-artifact@v4
        with:
          name: docroot-inventory
          path: docroot-inventory.txt
          if-no-files-found: warn
          retention-days: 30
