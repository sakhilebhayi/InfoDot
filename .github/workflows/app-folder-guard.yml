name: App Folder Guard

# Keeps the application folder of a platform from being served over HTTP. Found 2026-10-20: on Dopemine, Engage,
# Memory and Sheet the folder next to the docroot (`~/<host>/<key>/`) answered 200 for database/database.sqlite
# (the live SQLite database), storage/logs/laravel.log, composer files and vendor/autoload.php. The newer
# platforms have a `.htaccess` with `Require all denied` in that folder; these four never got one.
#
#   check   public probe of every platform's sensitive paths (status codes only; nothing is read)
#   apply   write `.htaccess` (Require all denied) into the named app folders over SSH, then re-probe; if the site
#           itself stops answering 200 the file is removed again and the run fails
#
# Fixed commands only. `apps` is a list of "host:key" pairs, e.g. "dopemine:dopemine engage:engage".
# Secrets for apply: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check | apply
        required: true
        default: check
        type: choice
        options: [check, apply]
      apps:
        description: 'Pairs host:key, space separated (apply needs at least one; check defaults to all platforms)'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  guard:
    name: ${{ inputs.mode }} app folders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      APPS: ${{ inputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        run: |
          printf '%s\n' "$APPS" | grep -Eq '^[a-z0-9: -]*$' || { echo "::error::apps may only contain a-z, 0-9, colon, space and dash"; exit 1; }
          if [ "$MODE" = apply ]; then
            [ -n "$APPS" ] || { echo "::error::apply needs apps"; exit 1; }
            for a in $APPS; do printf '%s' "$a" | grep -Eq '^[a-z0-9-]+:[a-z0-9-]+$' || { echo "::error::bad pair [$a]"; exit 1; }; done
          fi

      - name: Set up SSH
        if: ${{ inputs.mode == 'apply' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Write the guard (apply)
        if: ${{ inputs.mode == 'apply' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "bash -s -- $APPS" <<'GUARD'
          set -euo pipefail
          for pair in "$@"; do
            host="${pair%%:*}"; key="${pair##*:}"; app="$HOME/$host.infodot.co.za/$key"
            [ -f "$app/artisan" ] || { echo "$pair: no Laravel app at $app, skipped" >&2; continue; }
            if [ -f "$app/.htaccess" ] && grep -q 'Require all denied' "$app/.htaccess"; then
              echo "$pair: guard already present"
            elif [ -f "$app/.htaccess" ]; then
              cp "$app/.htaccess" "$app/.htaccess.before-guard"
              printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$app/.htaccess"
              echo "$pair: guard appended (original kept as .htaccess.before-guard)"
            else
              printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$app/.htaccess"
              echo "$pair: guard written (new file)"
            fi
          done
          GUARD

      - name: Probe from outside
        run: |
          sleep 8   # the web server re-reads .htaccess lazily
          if [ -n "$APPS" ]; then LIST="$APPS"; else LIST="tasks:tasks forms:forms files:files agents:agents analytics:analytics auction:auction billing:billing central:central design:design dopemine:dopemine ehail:ehail emall:emall engage:engage farms:farms finance:finance hr:hr memory:memory notify:notify plug:plug pres:press projects:projects pulse:pulse sheets:sheet tutor:tutor doc:doc"; fi
          bash tools/probe-exposure.sh $LIST | tee probe.txt
        continue-on-error: true
        id: probe

      - name: Undo if the sites stopped answering (apply)
        if: ${{ inputs.mode == 'apply' && steps.probe.outcome != 'skipped' }}
        run: |
          broken=""
          for a in $APPS; do
            h="${a%%:*}"
            c=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$h.infodot.co.za/up")
            [ "$c" = 200 ] || broken="$broken $a($c)"
          done
          if [ -n "$broken" ]; then
            echo "::error::these sites no longer answer /up with 200:$broken -- removing the guard I wrote"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "bash -s -- $APPS" <<'UNDO'
          for pair in "$@"; do
            host="${pair%%:*}"; key="${pair##*:}"; app="$HOME/$host.infodot.co.za/$key"
            if [ -f "$app/.htaccess.before-guard" ]; then mv -f "$app/.htaccess.before-guard" "$app/.htaccess"; else rm -f "$app/.htaccess"; fi
          done
          UNDO
            exit 1
          fi

      - name: Fail if anything is still exposed
        run: |
          grep -q EXPOSED probe.txt && { echo "::error::an app folder is still readable over HTTP (see the probe step)"; exit 1; } || echo "nothing exposed"
