name: Server Logs

# Read-only: collect the application's recent errors and the host facts needed to explain them, so failures are
# diagnosable without shell access. Fixed script on purpose (tools/diagnostics-host.sh) -- this workflow must never
# become a general remote shell.
#
# This repository is PUBLIC, and application errors can hold personal information, so NOTHING from the host is printed
# here. The bundle is encrypted to tools/diagnostics-public-key.pem and only the ciphertext is uploaded; the job log
# shows sizes and section names. Whoever holds the matching private key reads it:
#
#   gh run download <run-id> -n diagnostics -D out && cd out
#   openssl pkeyutl -decrypt -inkey <private-key.pem> -pkeyopt rsa_padding_mode:oaep -in key.enc -out key
#   openssl enc -d -aes-256-cbc -pbkdf2 -in diagnostics.enc -out diagnostics.txt -pass file:key && rm key
#
# Before this change the workflow tailed the newest file in storage/logs to the public job log. The newest file is
# always cron-scheduler.log (rewritten every minute), so it never showed an application error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    name: Collect encrypted diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Locate the app on the host
        # DEPLOY_PATH is optional. Without it the app is found as the single
        # `artisan` within two levels of the docroot ~/<DEPLOY_HOST>; zero or
        # several is an error, not a guess.
        run: |
          APP="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP" ]; then
            APP="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                SITE="${{ secrets.DEPLOY_HOST }}" \
                'bash -s' <<'FIND'
          set -euo pipefail
          D="$HOME/$SITE"
          # InfoDot is the main domain: its docroot is ~/public_html, not ~/<host>.
          [ -d "$D" ] || D="$HOME/public_html"
          A="$(find "$D" -maxdepth 2 -name artisan -type f -exec dirname {} \; | sort -u)"
          if [ "$(printf '%s\n' "$A" | grep -c .)" != 1 ]; then
            echo "expected exactly one Laravel app under the docroot, found: ${A:-none}" >&2
            exit 1
          fi
          printf '%s\n' "$A"
          FIND
            )"
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Collect (nothing is printed)
        run: |
          set -uo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/diag"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" 'bash -s' < tools/diagnostics-host.sh > "$RUNNER_TEMP/diag/diagnostics.txt" 2>&1
          echo "collector exit status: $?"
          echo "bundle: $(wc -l < "$RUNNER_TEMP/diag/diagnostics.txt") lines, $(wc -c < "$RUNNER_TEMP/diag/diagnostics.txt") bytes"
          echo "sections: $(grep -c '^===== ' "$RUNNER_TEMP/diag/diagnostics.txt")"
          grep -q '^===== end =====$' "$RUNNER_TEMP/diag/diagnostics.txt" || { echo "::error::the collector did not finish (no end marker)"; exit 1; }

      - name: Encrypt
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/diag"
          openssl rand -hex 32 > key
          openssl enc -aes-256-cbc -pbkdf2 -salt -in diagnostics.txt -out diagnostics.enc -pass file:key
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/tools/diagnostics-public-key.pem" \
              -pkeyopt rsa_padding_mode:oaep -in key -out key.enc
          rm -f key diagnostics.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv diagnostics.enc key.enc "$GITHUB_WORKSPACE/out/"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Upload the ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: out/
          retention-days: 3
          if-no-files-found: error
