name: Knowledge Library

# Publishes (or dry-runs) the official researched library on the production site, by running the app's own
# `knowledge:seed` command on the host. Fixed commands on purpose: this workflow must never become a general remote
# shell. The entries are the Markdown files under database/knowledge/ that the last deploy put on the host; the
# command is idempotent (an entry is updated in place by its key; a title a member already used is skipped and
# reported, never overwritten).
#
# This repository is PUBLIC, so NOTHING the host prints appears here: the output is encrypted to
# tools/diagnostics-public-key.pem and only the ciphertext is uploaded (the same arrangement as server-logs.yml and
# demo-content.yml; the commands to read it are in server-logs.yml's header). The job log shows the mode, the exit
# status and the size of the output.
#
# publish changes the live site: run the Backups workflow (mode run, keys infodot) first, and run `status` before it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: status (validate and list, writes nothing) | publish
        required: true
        default: status
        type: choice
        options: [status, publish]
      confirm:
        description: 'publish changes the live site: type "publish" to confirm'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: knowledge-library
  cancel-in-progress: false

jobs:
  library:
    name: knowledge library (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check the inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$MODE" in status|publish) ;; *) echo "::error::unknown mode"; exit 1 ;; esac
          if [ "$MODE" = publish ] && [ "$CONFIRM" != publish ]; then
            echo '::error::publish needs confirm=publish'; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Locate the app on the host
        run: |
          APP="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP" ]; then
            APP="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                SITE="${{ secrets.DEPLOY_HOST }}" \
                'bash -s' <<'FIND'
          set -euo pipefail
          D="$HOME/$SITE"
          [ -d "$D" ] || D="$HOME/public_html"
          A="$(find "$D" -maxdepth 2 -name artisan -type f -exec dirname {} \; | sort -u)"
          if [ "$(printf '%s\n' "$A" | grep -c .)" != 1 ]; then
            echo "expected exactly one Laravel app under the docroot, found: ${A:-none}" >&2
            exit 1
          fi
          printf '%s\n' "$A"
          FIND
            )"
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Run on the host (nothing is printed)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/knowledge"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" MODE="$MODE" 'bash -s' > "$RUNNER_TEMP/knowledge/output.txt" 2>&1 <<'RUN'
          set -uo pipefail
          cd "$DEPLOY_PATH" || exit 1
          PHP_BIN="$(command -v php || true)"
          [ -x /opt/alt/php84/usr/bin/php ] && PHP_BIN=/opt/alt/php84/usr/bin/php
          case "$MODE" in
            status)  "$PHP_BIN" artisan knowledge:seed --dry --no-interaction ;;
            publish) "$PHP_BIN" artisan knowledge:seed --no-interaction ;;
            *) echo "unknown mode"; exit 2 ;;
          esac
          RC=$?
          echo
          echo "== exit status: $RC"
          exit "$RC"
          RUN
          RC=$?
          echo "host exit status: $RC"
          echo "output: $(wc -l < "$RUNNER_TEMP/knowledge/output.txt") lines, $(wc -c < "$RUNNER_TEMP/knowledge/output.txt") bytes"
          echo "HOST_RC=$RC" >> "$GITHUB_ENV"

      - name: Encrypt
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/knowledge"
          openssl rand -hex 32 > key
          openssl enc -aes-256-cbc -pbkdf2 -salt -in output.txt -out knowledge.enc -pass file:key
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/tools/diagnostics-public-key.pem" \
              -pkeyopt rsa_padding_mode:oaep -in key -out key.enc
          rm -f key output.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv knowledge.enc key.enc "$GITHUB_WORKSPACE/out/"

      - name: Upload the ciphertext
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-library
          path: out/
          retention-days: 1
          if-no-files-found: error

      - name: Fail if the host command failed
        run: '[ "$HOST_RC" = 0 ] || { echo "::error::the knowledge command exited $HOST_RC on the host; read the encrypted output"; exit 1; }'
