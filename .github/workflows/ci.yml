name: CI

on:
  # Called by deploy.yml as the release gate.
  workflow_call: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      # .env must exist BEFORE composer install: the post-autoload-dump
      # package:discover boots the app, and with no .env the broadcaster
      # defaults to reverb with null credentials, which throws and fails
      # the install (every CI run since 2026-08-07 died here).
      - name: Prepare Environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      # .env.example points at Postgres; CI has only the SQLite file created
      # above, so the seed run (which proves the seeders still work) is
      # pointed at it explicitly. The test suite itself uses phpunit.xml's
      # in-memory SQLite and is unaffected.
      - name: Run Migrations and Seed
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: php artisan migrate:fresh --seed

      # Release gates added by the enterprise-readiness programme (docs/programme/enterprise/). Each passes on the
      # current code; each fails on a NEW problem. Legacy findings are in phpstan-baseline.neon and may only shrink.
      - name: Dependency advisories (high or critical block the release)
        run: bash tools/ci-composer-audit.sh

      - name: Static analysis (PHPStan level 5 against the baseline)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Code style (Pint, whole repository)
        run: vendor/bin/pint --test

      - name: Run Tests
        run: php artisan test

  frontend:
    name: frontend build and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --no-audit
      - name: Advisories (high or critical block the release)
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build

  coverage:
    name: test coverage (measured, not yet gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: pcov
          extensions: sqlite3, pdo_sqlite
      - name: Prepare Environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - name: Run tests with coverage
        run: php -d pcov.directory=app vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text=coverage.txt --colors=never
      - name: Summarise
        run: |
          { echo '### Line coverage of app/'; echo; grep -m1 -E '^\s*Lines:' coverage.txt || tail -n 12 coverage.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.txt

  cron-runner:
    name: cron runner (fake host)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the fake-host test of the cron runner and its installer
        run: bash tools/test-dot-cron.sh

  docroot-guard:
    name: docroot guard (fake host)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and lint
        run: |
          bash -n tools/docroot-guard-host.sh tools/probe-exposure.sh tools/site-status.sh tools/docroot-guard-summary.sh tools/test-docroot-guard.sh
          shellcheck -S warning tools/docroot-guard-host.sh tools/probe-exposure.sh tools/site-status.sh tools/docroot-guard-summary.sh tools/test-docroot-guard.sh
      - name: Run the fake-host test of the docroot guard (the host script is the one the workflow deploys; curl is a shim)
        run: bash tools/test-docroot-guard.sh

  docroot-inventory:
    name: docroot inventory (fake host, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and lint
        run: |
          bash -n tools/docroot-inventory-host.sh tools/docroot-inventory-summary.sh tools/test-docroot-inventory.sh
          shellcheck -S warning tools/docroot-inventory-host.sh tools/docroot-inventory-summary.sh tools/test-docroot-inventory.sh
      - name: Run the fake-host test of the docroot inventory (the host script is the one the workflow deploys; crontab is a stub that must only be read)
        run: bash tools/test-docroot-inventory.sh

  access-log-review:
    name: access log review (fake host, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and lint
        run: |
          bash -n tools/access-log-review-host.sh tools/test-access-log-review.sh tools/access-log-window-host.sh tools/test-access-log-window.sh
          shellcheck -S warning tools/access-log-review-host.sh tools/test-access-log-review.sh tools/access-log-window-host.sh tools/test-access-log-window.sh
      - name: Run the fake-host test of the access log review (synthetic logs; no IP address or user agent may reach the output; nothing may be written)
        run: bash tools/test-access-log-review.sh && bash tools/test-access-log-window.sh

  popia-inventory:
    name: personal data inventory (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and lint
        run: |
          python3 -m py_compile tools/popia-inventory.py
          bash -n tools/test-popia-inventory.sh
          shellcheck -S warning tools/test-popia-inventory.sh
      - name: Run the fixture test (migrations, casts, dependencies, hosts; no value from any .env.example may reach the output)
        run: bash tools/test-popia-inventory.sh

  backup-pull:
    name: off-host pull (forced command + Mac script)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and lint
        run: |
          bash -n tools/pull-dot-backups.sh tools/test-backup-pull.sh
          sh -n tools/backup-pull-serve.sh
          shellcheck -S warning tools/pull-dot-backups.sh tools/backup-pull-serve.sh tools/test-backup-pull.sh
      - name: Run the tests (the forced command allows only a read-only rsync of dot-backups; the pull flags bad checksums and stale archives)
        run: bash tools/test-backup-pull.sh

  backup-host:
    name: backup tool (fake host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP (for the SQLite3 fallback path)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: sqlite3, pdo_sqlite
      - name: Make sure the sqlite3 command line tool exists
        run: command -v sqlite3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
      - name: Syntax and lint
        run: |
          bash -n tools/backup-host.sh
          shellcheck -S warning tools/backup-host.sh tools/test-backup-host.sh
      - name: Run the fake-host test of the backup tool (real flock, real openssl, stub mysqldump/pg_dump/crontab)
        run: bash tools/test-backup-host.sh

  migrations-mysql:
    # Production runs MySQL; the suite above runs SQLite, which accepts things MySQL refuses (the first deploy of the
    # answers table failed on 2026-10-20 because SQLite did not check that a foreign key matched the INT UNSIGNED
    # id it points at). This job runs every migration, and the seeders, on a real MySQL.
    name: migrations on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: infodot_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql
      - name: Prepare Environment
        run: cp .env.example .env
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Generate Application Key
        run: php artisan key:generate
      - name: Run every migration on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: infodot_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force
